<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wedding social preview artwork</title>
  <link rel="stylesheet" href="../dist/fonts.css">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#fffdfb;color:#234b5c}
    .card{position:relative;width:1200px;height:630px;isolation:isolate;background:radial-gradient(ellipse at 28% 40%,#fffdfb 35%,#f0f7f1)}
    .church{position:absolute;right:0;top:0;width:525px;height:630px;object-fit:cover;object-position:65% center;opacity:.45;mask-image:linear-gradient(90deg,transparent,#000 45%);-webkit-mask-image:linear-gradient(90deg,transparent,#000 45%)}
    .portrait{position:absolute;width:315px;height:492px;right:85px;bottom:27px;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 9px 12px #234b5c14)}
    .frame{position:absolute;inset:22px;border:1px solid #ba914066;pointer-events:none}
    .flower{position:absolute;width:230px;height:230px;object-fit:contain;z-index:2}
    .flower-left{left:-66px;bottom:-64px;transform:rotate(15deg)}.flower-right{right:-74px;top:-80px;transform:rotate(192deg)}
    .copy{position:absolute;left:75px;top:52px;width:595px;text-align:center}
    .cross{width:20px;height:35px;display:block;margin:0 auto 17px;fill:#c62828}
    .eyebrow{font:500 13px/1.5 'DM Sans',sans-serif;letter-spacing:3.5px;color:#287b80;margin:0 0 14px}
    h1{font:400 91px/1.12 'Great Vibes',cursive;color:#a32663;margin:0}
    h1 em{display:block;font:italic 400 38px/.8 'Cormorant Garamond',serif;color:#ba9140;margin:4px 0 8px}
    .rule{width:86px;height:1px;background:#ba9140; margin:24px auto 20px}
    .date{font:500 20px/1.3 'DM Sans',sans-serif;letter-spacing:2px;margin:0 0 10px}
    .time{font:400 24px/1.3 'Cormorant Garamond',serif;margin:0 0 17px}
    .venue{font:500 13px/1.6 'DM Sans',sans-serif;letter-spacing:.1px;margin:0}.venue span{font-weight:400;color:#287b80}
  </style>
</head>
<body>
  <main class="card">
    <img class="church" src="../dist/assets/anime-church-narrow-wide.webp" alt="">
    <div class="frame"></div>
    <img class="portrait" src="../dist/assets/couple-bouquet-illustration.webp" alt="Illustrated portrait of Ragulbabu and Lydiya">
    <img class="flower flower-left" src="../dist/assets/anime-bouquet.webp" alt="">
    <img class="flower flower-right" src="../dist/assets/anime-bouquet.webp" alt="">
    <div class="copy">
      <svg class="cross" viewBox="0 0 24 38" aria-hidden="true"><path d="M10.5 0h3v11h9v3h-9v24h-3V14h-9v-3h9z"/></svg>
      <p class="eyebrow">YOU'RE INVITED TO OUR WEDDING</p>
      <h1>Ragulbabu<em>&amp;</em>Lydiya</h1>
      <div class="rule"></div>
      <p class="date">07 JANUARY 2027</p>
      <p class="time">4:00 PM onwards · Wedding &amp; Reception</p>
      <p class="venue">New Life Celebration Center<br><span>Pallavaram, Chennai</span></p>
    </div>
  </main>
</body>
</html>
