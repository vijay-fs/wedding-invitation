<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Responsive invitation preview</title><style>html,body{margin:0;background:#e5e7e2}body{padding:12px;font:11px sans-serif;color:#234b5c}p{margin:0 0 10px}iframe{border:0;display:block;background:#fffdfb;transform-origin:top left;box-shadow:0 5px 30px #233b4522}#frame-shell{margin:auto}</style><p id="label"></p><div id="frame-shell"><iframe title="Responsive wedding invitation" id="frame"></iframe></div><script>const query=new URLSearchParams(location.search);const w=Number(query.get('width'))||1440;const h=Number(query.get('height'))||960;const scale=Math.min(1,(innerWidth-24)/w,(innerHeight-70)/h);const frame=document.getElementById('frame');frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+scale+')';const shell=document.getElementById('frame-shell');shell.style.width=w*scale+'px';shell.style.height=h*scale+'px';document.getElementById('label').textContent=w+' × '+h+' · invitation preview';frame.src=(query.get('standalone')==='1'?'standalone.html':'index.html')+(query.get('section')?'#'+query.get('section'):'');</script></html>
